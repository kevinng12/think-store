name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PUBLIC_SHEET_URL: ${{ secrets.PUBLIC_SHEET_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config.js from secrets
        shell: bash
        run: |
          node -e "const fs=require('fs'); const cfg={ publicSheetUrl: process.env.PUBLIC_SHEET_URL || '', adminUsername: process.env.ADMIN_USERNAME || '', adminPassword: process.env.ADMIN_PASSWORD || '' }; fs.writeFileSync('config.js', 'window.APP_CONFIG = ' + JSON.stringify(cfg, null, 2) + ';\n');"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
