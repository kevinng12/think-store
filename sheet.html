<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Sheet Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="viewer-page">
    <div class="viewer-shell">
      <h1>Student Data</h1>

      <div id="loginSection">
        <h2>Login</h2>
        <form id="loginForm" class="sheet-form">
          <input id="username" class="sheet-input" type="text" placeholder="Username" />
          <input id="password" class="sheet-input" type="password" placeholder="Password" />
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
      </div>

      <div id="appSection" style="display: none;">
        <p>This page is connected to the configured spreadsheet and will display the Name, Grade, and Balance values from it.</p>

        <form id="studentForm" class="sheet-form" style="margin-top: 20px;">
          <input id="studentName" class="sheet-input" type="text" placeholder="Name" required />
          <input id="studentGrade" class="sheet-input" type="text" placeholder="Grade" required />
          <input id="studentBalance" class="sheet-input" type="number" step="0.01" placeholder="Balance" required />
          <button type="submit" class="btn btn-primary">Add Student</button>
        </form>

        <button id="logoutBtn" class="btn btn-secondary" style="margin-top: 12px;">Logout</button>
      </div>

      <div id="sheetStatus" class="sheet-status" aria-live="polite"></div>

      <div class="sheet-table-wrap">
        <table id="sheetTable" class="sheet-table" style="display: none;">
          <tbody></tbody>
        </table>
      </div>
    </div>

    <script src="config.js"></script>
    <script>
      const loginSection = document.getElementById('loginSection');
      const appSection = document.getElementById('appSection');
      const loginForm = document.getElementById('loginForm');
      const logoutBtn = document.getElementById('logoutBtn');
      const studentForm = document.getElementById('studentForm');
      const statusEl = document.getElementById('sheetStatus');
      const tableEl = document.getElementById('sheetTable');
      const tbodyEl = tableEl.querySelector('tbody');
      const appConfig = window.APP_CONFIG || {};
      const validUser = {
        username: appConfig.adminUsername || 'admin',
        password: appConfig.adminPassword || 'admin123'
      };
      const publicSheetUrl = appConfig.publicSheetUrl || '';
      const sheetWriteUrl = appConfig.sheetWriteUrl || '';
      const expectedHeaders = ['Name', 'Grade', 'Balance'];

      function showStatus(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = 'sheet-status';
        if (type) statusEl.classList.add(type);
      }

      function setLoggedIn(value) {
        localStorage.setItem('sheetAppLoggedIn', value ? 'true' : 'false');
      }

      function isLoggedIn() {
        return localStorage.getItem('sheetAppLoggedIn') === 'true';
      }

      function checkSession() {
        if (isLoggedIn()) {
          loginSection.style.display = 'none';
          appSection.style.display = 'block';
          loadSheet();
        } else {
          loginSection.style.display = 'block';
          appSection.style.display = 'none';
          tableEl.style.display = 'none';
          tbodyEl.innerHTML = '';
        }
      }

      function renderTable(rows) {
        tbodyEl.innerHTML = '';

        const firstRow = rows[0] || {};
        const normalizedHeaders = expectedHeaders.map((header) => {
          const match = Object.keys(firstRow).find((key) => String(key).trim().toLowerCase() === header.toLowerCase());
          return match || header;
        });

        const headerRow = document.createElement('tr');
        normalizedHeaders.forEach((header) => {
          const th = document.createElement('th');
          th.textContent = header;
          headerRow.appendChild(th);
        });
        tbodyEl.appendChild(headerRow);

        rows.forEach((row) => {
          const tr = document.createElement('tr');
          normalizedHeaders.forEach((header) => {
            const key = Object.keys(row).find((rowKey) => String(rowKey).trim().toLowerCase() === header.toLowerCase()) || header;
            const td = document.createElement('td');
            td.textContent = row[key] ?? '';
            tr.appendChild(td);
          });
          tbodyEl.appendChild(tr);
        });

        tableEl.style.display = 'table';
      }

      function parseCsv(rows) {
        if (!rows || !rows.length) return [];

        const headers = rows[0].map((header) => String(header).trim());
        const normalizedRows = rows.slice(1).filter((row) => row.some((value) => String(value ?? '').trim() !== '')).map((row) => {
          const entry = {};
          headers.forEach((header, index) => {
            entry[header] = row[index] ?? '';
          });
          return entry;
        });

        const hasRequiredColumns = expectedHeaders.every((header) =>
          headers.some((existing) => existing.trim().toLowerCase() === header.toLowerCase())
        );

        if (!hasRequiredColumns) {
          throw new Error(`The sheet must contain the columns: ${expectedHeaders.join(', ')}.`);
        }

        return normalizedRows;
      }

      function parseCsvText(csvText) {
        const rows = [];
        const lines = csvText.trim().split(/\r?\n/);
        for (const line of lines) {
          const cells = [];
          let current = '';
          let inQuotes = false;

          for (let i = 0; i < line.length; i += 1) {
            const char = line[i];
            const next = line[i + 1];

            if (char === '"') {
              if (inQuotes && next === '"') {
                current += '"';
                i += 1;
              } else {
                inQuotes = !inQuotes;
              }
            } else if (char === ',' && !inQuotes) {
              cells.push(current);
              current = '';
            } else {
              current += char;
            }
          }

          cells.push(current);
          rows.push(cells);
        }

        return parseCsv(rows);
      }

      async function fetchGoogleSheetAsJson(url) {
        const sheetIdMatch = url.match(/\/spreadsheets\/d\/([A-Za-z0-9-_]+)/);
        if (!sheetIdMatch) {
          throw new Error('The sheet URL is not a valid public Google Sheet link.');
        }

        const sheetId = sheetIdMatch[1];
        const jsonUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
        const response = await fetch(jsonUrl);
        if (!response.ok) {
          throw new Error('The Google Sheet is not public or the URL is incorrect.');
        }

        const text = await response.text();
        const jsonText = text.replace(/^google.visualization.Query.setResponse\(/, '').replace(/\);?$/, '');
        const payload = JSON.parse(jsonText);
        const table = payload?.table || {};
        const rows = table.rows || [];
        const cols = table.cols || [];

        if (!rows.length || !cols.length) {
          throw new Error('No rows were returned from the public Google Sheet.');
        }

        return rows.map((row) => {
          const item = {};
          cols.forEach((col, index) => {
            const value = row?.c?.[index]?.v ?? '';
            item[col.label || `Column${index + 1}`] = value;
          });
          return item;
        });
      }

      async function loadSheet() {
        try {
          if (!publicSheetUrl) {
            throw new Error('No public Google Sheet URL configured in config.js.');
          }

          showStatus('Loading student data...');

          let data;
          try {
            const response = await fetch(publicSheetUrl);
            if (!response.ok) {
              throw new Error('CSV export was not available.');
            }

            const csvText = await response.text();
            data = parseCsvText(csvText);
          } catch (error) {
            data = await fetchGoogleSheetAsJson(publicSheetUrl);
          }

          if (!Array.isArray(data) || data.length === 0) {
            throw new Error('No rows returned from the public Google Sheet data.');
          }

          const hasRequiredColumns = expectedHeaders.every((header) =>
            Object.keys(data[0]).some((key) => String(key).trim().toLowerCase() === header.toLowerCase())
          );

          if (!hasRequiredColumns) {
            throw new Error(`The sheet data is missing required columns: ${expectedHeaders.join(', ')}.`);
          }

          renderTable(data);
          showStatus('Student data loaded successfully.', 'success');
        } catch (error) {
          tableEl.style.display = 'none';
          tbodyEl.innerHTML = '';
          showStatus(error.message || 'Something went wrong. Make sure the Google Sheet is public and the URL is a CSV export link.', 'error');
        }
      }

      async function writeStudentToSheet(payload) {
        if (!sheetWriteUrl) {
          throw new Error('No write endpoint configured. Set sheetWriteUrl in config.js.');
        }

        const body = {
          Name: String(payload.Name || '').trim(),
          Grade: String(payload.Grade || '').trim(),
          Balance: String(payload.Balance || '').trim()
        };

        if (!body.Name || !body.Grade || !body.Balance) {
          throw new Error('Name, Grade, and Balance are required.');
        }

        const response = await fetch(sheetWriteUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok || result.status !== 'success') {
          throw new Error(result.message || 'Unable to save the student record.');
        }

        return result;
      }

      studentForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const payload = {
          Name: document.getElementById('studentName').value,
          Grade: document.getElementById('studentGrade').value,
          Balance: document.getElementById('studentBalance').value
        };

        try {
          showStatus('Adding student to sheet...', '');
          await writeStudentToSheet(payload);
          studentForm.reset();
          await loadSheet();
          showStatus('Student added successfully.', 'success');
        } catch (error) {
          showStatus(error.message || 'Something went wrong while writing to the sheet.', 'error');
        }
      });

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (username === validUser.username && password === validUser.password) {
          setLoggedIn(true);
          showStatus('Login successful.', 'success');
          checkSession();
          return;
        }

        setLoggedIn(false);
        showStatus('Invalid username or password.', 'error');
      });

      logoutBtn.addEventListener('click', () => {
        setLoggedIn(false);
        checkSession();
        showStatus('Logged out.', 'success');
      });

      checkSession();
    </script>
  </body>
</html>
